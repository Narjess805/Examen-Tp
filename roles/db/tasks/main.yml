---
- name: Installer MySQL Server et PyMySQL
  apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deployer la configuration MySQL (ecoute sur 0.0.0.0)
  template:
    src: mysqld.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mysql

- name: Demarrer et activer MySQL
  service:
    name: mysql
    state: started
    enabled: true

- name: Appliquer les handlers maintenant
  meta: flush_handlers

- name: Creer la base app_db
  mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Creer app_user (acces depuis 192.168.56.0/24)
  mysql_user:
    name: "{{ db_user }}"
    host: "{{ db_network }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    update_password: on_create
    login_unix_socket: /var/run/mysqld/mysqld.sock